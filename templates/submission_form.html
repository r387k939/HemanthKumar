{% extends "base.html" %}
{% block title %}Submission Form{% endblock %}
{% block content %}
<h2 class="mb-3">Record Submission</h2>

<div class="card shadow-sm form-card">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Assignment</label>
                    <select class="form-select" name="assignment_id" required>
                        {% for item in assignments %}
                        <option value="{{ item.assignment_id }}">{{ item.title }} ({{ item.course.course_name }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Student</label>
                    <select class="form-select" name="student_id" required>
                        {% for item in students %}
                        <option value="{{ item.student_id }}">{{ item.full_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label">Score</label>
                    <input class="form-control" name="score" type="number" step="0.01" min="0">
                </div>
                <div class="col-md-8">
                    <label class="form-label">Grader note</label>
                    <input class="form-control" name="grader_note" maxlength="255">
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('submissions') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
