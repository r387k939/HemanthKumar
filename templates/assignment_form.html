{% extends "base.html" %}
{% block title %}Assignment Form{% endblock %}
{% block content %}
<h2 class="mb-3">Add Assignment</h2>

<div class="card shadow-sm form-card">
    <div class="card-body">
        <form method="post">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label">Course</label>
                    <select class="form-select" name="course_id" required>
                        {% for item in courses %}
                        <option value="{{ item.course_id }}">{{ item.course_name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Title</label>
                    <input class="form-control" name="title" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Max score</label>
                    <input class="form-control" name="max_score" type="number" min="1" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label">Due date</label>
                    <input class="form-control" name="due_date" type="date" required>
                </div>
            </div>
            <div class="mt-4 d-flex gap-2">
                <button class="btn btn-primary" type="submit">Save</button>
                <a class="btn btn-outline-secondary" href="{{ url_for('assignments') }}">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
